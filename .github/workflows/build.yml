name: Build Bonelab Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Create Project File
        run: |
          dotnet new classlib -n PeeMod
          Remove-Item PeeMod/Class1.cs
          Move-Item PeeMod.cs PeeMod/

      - name: Download Modding Dependencies
        run: |
          # Automated download steps for MelonLoader and BoneLib references go here

      - name: Build DLL
        run: dotnet build PeeMod/PeeMod.csproj -c Release

      - name: Upload Finished Mod
        uses: actions/upload-artifact@v3
        with:
          name: PeeMod-DLL
          path: PeeMod/bin/Release/net6.0/PeeMod.dll
